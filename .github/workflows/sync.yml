name: Sync PAYchat Channels
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Ethiopian and Global Channels
        env:
          API_KEY: ${{ secrets.PAYCHAT_API_KEY }}
        run: |
          python3 - << 'EOF'
          import json, urllib.request, os

          api_key = os.environ["API_KEY"]
          headers = {"X-API-Key": api_key, "User-Agent": "EthioPAYchat/1.0"}

          def fetch_all(params_base):
              items = []
              offset = 0
              limit = 100
              while True:
                  url = f"https://paychat.info/api/partner/shop/channels?{params_base}&limit={limit}&offset={offset}"
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req) as resp:
                      data = json.loads(resp.read().decode("utf-8"))
                  batch = data.get("channels") or data.get("data") or data.get("items") or (data if isinstance(data, list) else [])
                  if not batch:
                      break
                  items.extend(batch)
                  total = data.get("total", 0)
                  offset += limit
                  if len(batch) < limit or (total and offset >= total):
                      break
              return items

          # 1. Fetch Ethiopia (Main)
          ethio = fetch_all("country=ET")
          with open("channels.json", "w", encoding="utf-8") as f:
              json.dump({"channels": ethio}, f, ensure_ascii=False)

          # 2. Fetch Global + All Other Countries
          all_channels = fetch_all("country=GLOBAL")
          extra = fetch_all("")
          seen = {str(c.get("id") or c.get("channel_id")) for c in all_channels}
          ethio_ids = {str(c.get("id") or c.get("channel_id")) for c in ethio}
          for c in extra:
              cid = str(c.get("id") or c.get("channel_id"))
              if cid not in seen and cid not in ethio_ids:
                  all_channels.append(c)
                  seen.add(cid)

          with open("global_channels.json", "w", encoding="utf-8") as f:
              json.dump({"channels": all_channels}, f, ensure_ascii=False)

          print(f"Synced {len(ethio)} Ethiopia channels and {len(all_channels)} Global channels.")
          EOF

      - name: Commit JSON files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add channels.json global_channels.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Sync all Ethiopia & Global channels" && git push)
