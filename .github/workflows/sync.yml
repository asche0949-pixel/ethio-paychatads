name: Sync PAYchat Channels
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Ethiopian and Global Channels
        env:
          API_KEY: pk_73322f48768ebe5bbd3014289b29ef3948a1289ac2c411a7
        run: |
          python3 - << 'EOF'
          import json, urllib.request, os

          api_key = os.environ["API_KEY"].strip()
          headers = {"X-API-Key": api_key, "User-Agent": "EthioPAYchat/1.0"}

          def clean_str(val):
              if isinstance(val, str):
                  return val.encode("utf-8", "ignore").decode("utf-8")
              return val

          def slim_channel(c):
              keep = ["id", "channel_id", "title", "name", "username", "description", "category", "country", "language", "subscribers", "members", "views", "avg_views", "er", "price", "post_price", "avatar", "photo", "image", "verified", "rating"]
              return {k: clean_str(v) for k, v in c.items() if k in keep and v is not None}

          def fetch_all(query_str, max_items=600):
              items = []
              offset = 0
              limit = 100
              while len(items) < max_items:
                  sep = "&" if query_str else ""
                  url = f"https://paychat.info/api/partner/shop/channels?{query_str}{sep}limit={limit}&offset={offset}"
                  req = urllib.request.Request(url, headers=headers)
                  try:
                      with urllib.request.urlopen(req) as resp:
                          raw = resp.read().decode("utf-8", "ignore")
                          data = json.loads(raw)
                  except Exception as e:
                      print(f"Error fetching {url}: {e}")
                      break
                  batch = data.get("channels") or data.get("data") or data.get("items") or (data if isinstance(data, list) else [])
                  if not batch:
                      break
                  for item in batch:
                      items.append(slim_channel(item))
                      if len(items) >= max_items:
                          break
                  total = data.get("total", 0)
                  offset += limit
                  if len(batch) < limit or (total and offset >= total):
                      break
              return items

          ethio = fetch_all("country=ET", max_items=500)
          with open("channels.json", "w", encoding="utf-8") as f:
              json.dump({"channels": ethio}, f, ensure_ascii=True, separators=(",", ":"))

          global_list = fetch_all("country=GLOBAL", max_items=600)
          if len(global_list) < 100:
              global_list.extend(fetch_all("", max_items=600))

          ethio_ids = {str(c.get("id") or c.get("channel_id")) for c in ethio}
          combined = []
          seen = set()

          for c in global_list:
              cid = str(c.get("id") or c.get("channel_id"))
              if cid not in seen and cid not in ethio_ids:
                  combined.append(c)
                  seen.add(cid)
              if len(combined) >= 600:
                  break

          with open("global_channels.json", "w", encoding="utf-8") as f:
              json.dump({"channels": combined}, f, ensure_ascii=True, separators=(",", ":"))

          print(f"Synced {len(ethio)} Ethiopia and {len(combined)} Global channels.")
          EOF

      - name: Commit JSON files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add channels.json global_channels.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Sync Ethiopia & Global channels" && git push)
